<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="stylesheet" href="app.css" />
</head>
<body>
<svg class="sprite" aria-hidden="true"><defs><g id="riskyMark"></g></defs></svg>

<div class="frame">
  <aside class="side">
    <a class="side__logo" href="../" title="risky home" aria-label="risky">
      <svg viewBox="0 0 761 296" aria-hidden="true"><use href="#riskyMark" /></svg>
    </a>
    <nav class="side__nav" id="nav">
      <a class="side__link" href="#/" data-route="explore"><span class="slug">/markets</span> Explore</a>
      <a class="side__link" href="#/create" data-route="create"><span class="slug">/open</span> Open a market</a>
      <a class="side__link" href="../docs/" data-route="docs"><span class="slug">/docs</span> How it works</a>
    </nav>
    <div class="side__foot">
      <span class="side__chain">Robinhood Chain · 4663</span>
      <a href="https://robinhoodchain.blockscout.com/address/0xF9d9DdDc5cbD08021953C346C1E325F0CC03324a" target="_blank" rel="noopener">Factory on Blockscout ↗</a>
      <a href="../docs/">Read the docs ↗</a>
      <a href="https://github.com/RiskyMarkets/risky" target="_blank" rel="noopener">Open source ↗</a>
      <span>No admin. No pause. No upgrade.</span>

  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 class="top__title" id="title">Explore</h1>

      <div class="wallet" id="wallet">
        <button class="btn" id="connectBtn">Connect wallet</button>

    </header>

  </main>
</div>

<script type="module" src="app.js"></script>

</html>
